name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-milestone-validation:
    name: controlled-milestone-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Mandatory V4.29 milestone preflight, regression and release hygiene
        run: >-
          python scripts/run_milestone_validation_v429.py
          --milestone-id V4.29-RECOVERY
          --baseline-version V4.28-RECOVERY
          --baseline-sha256-file V428_BASELINE_ARCHIVE_SHA256.txt
          --matrix compliance_v429.csv
          --impacted-requirement CI-PREFLIGHT-01
          --impacted-requirement REPO-GOV-01
          --impacted-requirement REPO-GOV-02
          --impacted-requirement REPO-GOV-03
          --impacted-requirement REPO-GOV-CAPTURE-01
          --impacted-requirement REPO-GOV-SIGN-01
          --impacted-requirement REPO-GOV-PATH-01
          --impacted-requirement REPO-GOV-PATH-02
          --impacted-requirement REPO-GOV-PATH-03
          --impacted-requirement REPO-GOV-PATH-04
          --owner "Platform Engineering"
          --decision-id "V429-${{ github.run_id }}-${{ github.run_attempt }}"
          --event-store .audit/V428_MILESTONE_PREFLIGHT.sqlite3
          --report .audit/V428_MILESTONE_PREFLIGHT.json

      - name: Audit remote repository governance evidence (non-fatal until signed evidence is supplied)
        if: always()
        run: >-
          python scripts/verify_repository_governance.py
          --repository "${{ github.repository }}"
          --branch "${{ github.event.repository.default_branch || 'main' }}"
          --evidence V424_REPOSITORY_GOVERNANCE_EVIDENCE_TEMPLATE.json
          --trust config/repository_governance_trust_v424.json
          --report .audit/V428_REPOSITORY_GOVERNANCE.json
          --event-store .audit/V428_REPOSITORY_GOVERNANCE.sqlite3

      - name: Upload preflight and governance audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: V428-validation-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .audit/V428_MILESTONE_PREFLIGHT.json
            .audit/V428_MILESTONE_PREFLIGHT.sqlite3
            .audit/V428_REPOSITORY_GOVERNANCE.json
            .audit/V428_REPOSITORY_GOVERNANCE.sqlite3
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
