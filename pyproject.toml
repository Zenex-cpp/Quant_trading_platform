[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform"
version = "3.61.0"
description = "Specification-first quantitative trading platform with mandatory Champion gate authority, causal TTL enforcement, dependency invalidation, final-holdout access control, and unified operational truth across governance, deployment, health, provenance, accounting, reconciliation, and risk"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_platform*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
